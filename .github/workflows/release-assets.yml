name: Attach release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.0

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.event.inputs.tag || 'v1.0' }}

jobs:
  attach:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for a real iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project DarshanFileManager.xcodeproj -scheme DarshanFileManager \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tail -30
      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products -name 'DarshanFileManager.app' -path '*iphoneos*' | head -1); echo "app: $APP"
          mkdir Payload && cp -R "$APP" Payload/
          zip -qr DarshanFileManager-unsigned.ipa Payload
          ls -la DarshanFileManager-unsigned.ipa
      - name: Upload .ipa to the release
        run: gh release upload "$TAG" DarshanFileManager-unsigned.ipa --clobber
